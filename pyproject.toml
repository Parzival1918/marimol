[project]
name = "marimol"
version = "0.1.0"
description = "Molecular visualizer for marimo notebooks"
readme = "README.md"
authors = [
    { name = "Pedro Juan Royo", email = "pedro.juan.royo@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anywidget>=0.11.0",
    "marimo>=0.23.16",
    "traitlets>=5.16.1",
]

[project.optional-dependencies]
external = [
    "ase>=3.29.0",
    "pymatgen>=2026.5.4",
]
all = [
    "marimol[external]",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prek>=0.4.12",
    "ruff>=0.16.2",
]
